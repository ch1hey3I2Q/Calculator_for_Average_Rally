<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="styles/style.css" rel="stylesheet" />
    <title>アベレージラリー用計算機
    </title>
  </head>
  <body>
    <p>06/14/16:56</p>
    <div id="function_1">
      <h3>コントロールシート計算</h3>
      <div>
        <!-- 入力 -->
        <form>
          <div>
            <label for="input_time1">時刻①:</label>
            <input id="input_time1" class="inputs" type="number" name="time1" min="0" step="1" placeholder="hhmmss">
          </div>
          <div>
            <label for="input_time2">時刻②:</label>
            <input id="input_time2" class="inputs" type="number" name="time2" min="0" step="1" placeholder="hhmmss">
          </div>
          <div>
            <label for="input_time3">レスコンカード③:</label>
            <input id="input_time3" class="inputs" type="number" name="time3" min="0" step="1" placeholder="mmss">
          </div>
          <div>
            所要時間(①-②-③)④:<span id="output1-1" class="outputs">--</span>
          </div>
          <div>
            <label for="input_time4">正解時間⑤:</label>
            <input id="input_time4" class="inputs" type="number" name="time4" min="0" step="1" enterkeyhint="go" placeholder="mmss">
          </div>
          <div>
            誤差(④-⑤):<span id="output1-2" class="outputs">--</span>
          </div>
          <button id="btn_next" type="button">次PC</button>
        </form>
      </div>
      <!-- <p>
        出力<br>
        所要時間:<span id="output1" class="outputs">--</span>
      </p> -->
    </div>
    <div id="function_2">
      <h3>距離Dを速度１と速度２で走った時の時間差</h3>
      <div>
        <!-- 入力 -->
        <form>
          <div>
            <label for="input_distance">距離①:</label>
            <input id="input_distance" class="inputs" type="number" name="distance" min="0" step="0.001" placeholder="[km]">
          </div>
          <div>
            <label for="input_speed1">速度②:</label>
            <input id="input_speed1" class="inputs" type="number" name="speed1" min="0" step="1" placeholder="[km/h]">
          </div>
          <div>
            <label for="input_speed2">速度③:</label>
            <input id="input_speed2" class="inputs" type="number" name="speed2" min="0" step="1" placeholder="[km/h]">
          </div>
        </form>
      </div>
      <p>
        <!-- 出力<br> -->
        所要時間(①/②)④:<span id="output2-1" class="outputs">--</span><br>
        所要時間(①/③)⑤:<span id="output2-2" class="outputs">--</span><br>
        時間差(④/⑤):<span id="output2-3" class="outputs">--</span>
      </p>
    </div>
  </body>
  <script src="scripts/main.js"></script>
</html>
